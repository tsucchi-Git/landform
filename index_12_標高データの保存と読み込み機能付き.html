<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D/3D地形エディタ（データ保存・読み込み機能付き）</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #222;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding-top: 20px;
            box-sizing: border-box;
        }
        h1 { margin: 0 0 10px 0; font-size: 1.2rem; }
        
        .toolbar {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .sub-toolbar {
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
            align-items: center;
            font-size: 0.9rem;
            color: #ccc;
        }
        button, label.btn-label {
            padding: 8px 16px;
            font-size: 0.9rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background-color: #444;
            color: #fff;
            transition: background-color 0.2s;
            display: inline-block;
        }
        button.active {
            background-color: #007bff;
            font-weight: bold;
        }
        button#roadBtn.active { background-color: #6c757d; font-weight: bold; }
        button#riverBtn.active { background-color: #1d63ed; font-weight: bold; }
        button#houseBtn.active { background-color: #dc3545; font-weight: bold; }
        
        button.size-btn {
            padding: 5px 12px;
            font-size: 0.8rem;
            background-color: #3a3a3a;
        }
        button.size-btn.active {
            background-color: #e0a800;
            color: #000;
            font-weight: bold;
        }
        button#viewBtn { background-color: #28a745; font-weight: bold; }
        button#colorToggleBtn { background-color: #17a2b8; display: none; }
        button#colorToggleBtn.active { background-color: #e0a800; color: #000; font-weight: bold; }
        
        button#contourToggleBtn { background-color: #20c997; display: inline-block; }
        button#contourToggleBtn.active { background-color: #e0a800; color: #000; font-weight: bold; }
        
        button#saveBtn { background-color: #fd7e14; font-weight: bold; }
        label#loadLabel { background-color: #17a2b8; font-weight: bold; cursor: pointer; }

        button#undoBtn { background-color: #6f42c1; }
        button#clearBtn { background-color: #dc3545; }
        button:disabled, label.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

        .canvas-container {
            position: relative;
            width: 480px;  
            height: 480px;
            border: 4px solid #282828;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background-color: #1a1a1a;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #terrainCanvas { z-index: 2; cursor: crosshair; }
        #threeCanvas { z-index: 1; display: none; cursor: grab; }
        #threeCanvas:active { cursor: grabbing; }

        .controls {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #ccc;
            text-align: center;
            min-height: 45px;
            line-height: 1.5;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>
<body>

    <h1>地形・道路・川・家 メッシュ エディタ</h1>

    <div class="toolbar">
        <button id="raiseBtn" class="active" onclick="setMode('raise')">丘を盛る</button>
        <button id="roadBtn" onclick="setMode('road')">道路を敷く</button>
        <button id="riverBtn" onclick="setMode('river')">川を流す</button>
        <button id="houseBtn" onclick="setMode('house')">家を建てる</button>
        <button id="eraseBtn" onclick="setMode('erase')">一部消しゴム</button>
        <button id="undoBtn" onclick="undo()">1手戻る</button>
        <button id="clearBtn" onclick="clearAll()">全消し</button>
        
        <!-- 保存・読み込みボタン -->
        <button id="saveBtn" onclick="saveToFile()">データを保存</button>
        <label id="loadLabel" class="btn-label">
            データを読み込み
            <input type="file" id="fileInput" accept=".json" onchange="loadFromFile(event)" style="display: none;">
        </label>

        <button id="viewBtn" onclick="toggleViewMode()">3D表示に切り替え</button>
        <button id="colorToggleBtn" onclick="toggleElevationColor()">標高の色分け: OFF</button>
        <button id="contourToggleBtn" onclick="toggleContourLine()">等高線の表示: OFF</button>
    </div>

    <div class="sub-toolbar" id="brushSizeArea">
        <span>筆の太さ：</span>
        <button id="sizeMinBtn" class="size-btn active" onclick="setBrushSize('min')">極細（直径1マス）</button>
        <button id="sizeSmallBtn" class="size-btn" onclick="setBrushSize('small')">細い（直径2マス）</button>
        <button id="sizeLargeBtn" class="size-btn" onclick="setBrushSize('large')">太い（直径5マス）</button>
    </div>

    <div class="canvas-container">
        <canvas id="terrainCanvas"></canvas>
        <canvas id="threeCanvas"></canvas>
    </div>
    
    <div id="guideText" class="controls">
        選択中のモードで画面をドラッグしてください。
    </div>

<script>
// --- 基本設定 ---
const GRID_SIZE = 40;  
const CELL_SIZE = 12;  
const CANVAS_WIDTH = GRID_SIZE * CELL_SIZE; 
const CANVAS_HEIGHT = GRID_SIZE * CELL_SIZE; 

const canvas2d = document.getElementById('terrainCanvas');
const ctx = canvas2d.getContext('2d');
canvas2d.width = CANVAS_WIDTH;
canvas2d.height = CANVAS_HEIGHT;

const canvas3d = document.getElementById('threeCanvas');
canvas3d.width = CANVAS_WIDTH;
canvas3d.height = CANVAS_HEIGHT;

let heightMap = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(0));
let roadMap = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false));
let riverMap = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false));
let houseMap = Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false)); 

let historyStack = [];
const MAX_HISTORY = 10; 

let currentBrushRadius = 0.5;  
const BRUSH_SPEED = 0.6; 
const ERASE_SPEED = 0.9; 
const MAX_HEIGHT = 40;   

let isDrawing = false;
let hasChangedThisStroke = false; 
let currentMode = 'raise'; 
let viewMode = '2D';       
let useElevationColor3D = false; 
let showContour3D = false; 
let showContour2D = false; 
let lastPlacedHouseCell = { x: -1, y: -1 }; 

let scene, camera, renderer, terrainMesh, customMaterial, controls;
let roadSegments = [];
let riverSegments = [];
let houseGroups = []; 

// ★ファイル保存機能
function saveToFile() {
    const data = {
        gridSize: GRID_SIZE,
        heightMap: heightMap,
        roadMap: roadMap,
        riverMap: riverMap,
        houseMap: houseMap
    };
    
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    
    const a = document.createElement('a');
    a.href = url;
    a.download = 'terrain_data.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// ★ファイル読み込み機能
function loadFromFile(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = JSON.parse(e.target.result);
            if (data.heightMap && data.gridSize === GRID_SIZE) {
                saveHistory();
                heightMap = data.heightMap;
                roadMap = data.roadMap || Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false));
                riverMap = data.riverMap || Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false));
                houseMap = data.houseMap || Array.from({ length: GRID_SIZE }, () => new Array(GRID_SIZE).fill(false));
                
                if (viewMode === '2D') draw2D(); else sync2DTo3D();
                alert('地形データを読み込みました。');
            } else {
                alert('読み込んだファイルの形式またはグリッドサイズが一致しません。');
            }
        } catch (err) {
            alert('ファイルの読み込みに失敗しました。');
        }
    };
    reader.readAsText(file);
    event.target.value = ''; // 入力をリセット
}

function saveHistory() {
    const snapshot = {
        height: heightMap.map(row => [...row]),
        road: roadMap.map(row => [...row]),
        river: riverMap.map(row => [...row]),
        house: houseMap.map(row => [...row])
    };
    historyStack.push(snapshot);
    if (historyStack.length > MAX_HISTORY) { historyStack.shift(); }
}

function undo() {
    if (viewMode === '3D' || historyStack.length === 0) return;
    const previousState = historyStack.pop();
    heightMap = previousState.height;
    roadMap = previousState.road;
    riverMap = previousState.river;
    houseMap = previousState.house;
    draw2D();
}

function get3DTerrainColor(h) {
    if (!useElevationColor3D || h <= 0) {
        return { r: 34, g: 139, b: 34 }; 
    }
    let r = 34, g = 139, b = 34;
    if (h < 12) {
        let ratio = h / 12;
        r = Math.floor(34 + (180 - 34) * ratio);
        g = Math.floor(139 + (210 - 139) * ratio);
        b = Math.floor(34 + (50 - 34) * ratio);
    } else if (h < 26) {
        let ratio = (h - 12) / (26 - 12);
        r = Math.floor(180 + (139 - 180) * ratio);
        g = Math.floor(210 + (90 - 210) * ratio);
        b = Math.floor(50 + (26 - 50) * ratio);
    } else {
        let ratio = Math.min(1.0, (h - 26) / (MAX_HEIGHT - 26));
        r = Math.floor(139 + (245 - 139) * ratio);
        g = Math.floor(90 + (245 - 90) * ratio);
        b = Math.floor(26 + (245 - 26) * ratio);
    }
    return { r, g, b };
}

function init3D() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a1a);

    camera = new THREE.PerspectiveCamera(45, CANVAS_WIDTH / CANVAS_HEIGHT, 1, 1000);
    resetCameraPosition();

    renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
    renderer.setSize(CANVAS_WIDTH, CANVAS_HEIGHT);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(GRID_SIZE / 2, 0, GRID_SIZE / 2); 
    controls.enableDamping = true; 
    controls.dampingFactor = 0.05;

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(1, 2, 1).normalize();
    scene.add(dirLight);
    scene.add(new THREE.AmbientLight(0x666666));

    const geometry = new THREE.PlaneGeometry(GRID_SIZE, GRID_SIZE, GRID_SIZE - 1, GRID_SIZE - 1);
    geometry.rotateX(-Math.PI / 2); 
    geometry.translate(GRID_SIZE / 2, 0, GRID_SIZE / 2);

    customMaterial = new THREE.MeshLambertMaterial({
        vertexColors: true,
        flatShading: true
    });

    customMaterial.onBeforeCompile = (shader) => {
        shader.uniforms.uShowContour = { value: showContour3D };
        customMaterial.userData.shader = shader;

        shader.vertexShader = `
            varying float vHeightY;
        ` + shader.vertexShader;

        shader.vertexShader = shader.vertexShader.replace(
            `#include <begin_vertex>`,
            `#include <begin_vertex>
             vHeightY = position.y;
            `
        );

        shader.fragmentShader = `
            uniform bool uShowContour;
            varying float vHeightY;
        ` + shader.fragmentShader;

        shader.fragmentShader = shader.fragmentShader.replace(
            `vec4 diffuseColor = vec4( diffuse, opacity );`,
            `
            vec4 diffuseColor = vec4( diffuse, opacity );
            if (uShowContour) {
                float interval = 0.9; 
                float modulo = mod(vHeightY, interval);
                float thickness = 0.05; 
                if (modulo < thickness || modulo > (interval - thickness)) {
                    diffuseColor.rgb *= 0.1;
                }
            }
            `
        );
    };

    const wireframeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.12 });
    
    terrainMesh = new THREE.Mesh(geometry, customMaterial);
    const wireframe = new THREE.Mesh(geometry, wireframeMaterial);
    terrainMesh.add(wireframe);
    scene.add(terrainMesh);
}

function resetCameraPosition() {
    camera.position.set(GRID_SIZE / 2, GRID_SIZE, GRID_SIZE * 1.2);
}

function sync2DTo3D() {
    const position = terrainMesh.geometry.attributes.position;
    const count = position.count;
    const colors = new Float32Array(count * 3);

    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            const index = y * GRID_SIZE + x;
            let h = heightMap[x][y];
            if (riverMap[x][y]) { h = Math.max(0, h - 2.0); }
            position.setY(index, h * 0.3); 

            const c = get3DTerrainColor(heightMap[x][y]);
            colors[index * 3]     = c.r / 255;
            colors[index * 3 + 1] = c.g / 255;
            colors[index * 3 + 2] = c.b / 255;
        }
    }
    
    terrainMesh.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    position.needsUpdate = true;
    terrainMesh.geometry.attributes.color.needsUpdate = true;
    terrainMesh.geometry.computeVertexNormals(); 

    if (customMaterial.userData.shader) {
        customMaterial.userData.shader.uniforms.uShowContour.value = showContour3D;
    }

    roadSegments.forEach(seg => scene.remove(seg)); roadSegments = [];
    riverSegments.forEach(seg => scene.remove(seg)); riverSegments = [];
    houseGroups.forEach(group => scene.remove(group)); houseGroups = [];

    const roadMaterial = new THREE.MeshBasicMaterial({ color: 0x444444 }); 
    const roadWidth = 0.85;
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            if (roadMap[x][y]) {
                const currentHeight = heightMap[x][y] * 0.3;
                const roadGeom = new THREE.PlaneGeometry(roadWidth, roadWidth);
                roadGeom.rotateX(-Math.PI / 2);
                const roadMesh = new THREE.Mesh(roadGeom, roadMaterial);
                roadMesh.position.set(x + 0.5, currentHeight + 0.02, y + 0.5);
                scene.add(roadMesh);
                roadSegments.push(roadMesh);
            }
        }
    }

    const riverMaterial = new THREE.MeshLambertMaterial({ color: 0x1d63ed }); 
    const riverWidth = 1.0; 
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            if (riverMap[x][y]) {
                const currentHeight = (heightMap[x][y] - 0.6) * 0.3;
                const riverGeom = new THREE.PlaneGeometry(riverWidth, riverWidth);
                riverGeom.rotateX(-Math.PI / 2);
                const riverMesh = new THREE.Mesh(riverGeom, riverMaterial);
                riverMesh.position.set(x + 0.5, Math.max(0.01, currentHeight), y + 0.5);
                scene.add(riverMesh);
                riverSegments.push(riverMesh);
            }
        }
    }

    const wallMaterial = new THREE.MeshLambertMaterial({ color: 0xeeeeee }); 
    const roofMaterial = new THREE.MeshLambertMaterial({ color: 0xdc3545 }); 
    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            if (houseMap[x][y]) {
                const currentHeight = heightMap[x][y] * 0.3;
                const houseGroup = new THREE.Group();
                const wallMesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.7), wallMaterial);
                wallMesh.position.y = 0.3;
                houseGroup.add(wallMesh);
                const roofGeom = new THREE.ConeGeometry(0.55, 0.4, 4);
                roofGeom.rotateY(Math.PI / 4);
                const roofMesh = new THREE.Mesh(roofGeom, roofMaterial);
                roofMesh.position.y = 0.8;
                houseGroup.add(roofMesh);
                houseGroup.position.set(x + 0.5, currentHeight, y + 0.5);
                scene.add(houseGroup);
                houseGroups.push(houseGroup);
            }
        }
    }
}

function animate3D() {
    if (viewMode !== '3D') return;
    requestAnimationFrame(animate3D);
    controls.update(); 
    renderer.render(scene, camera);
}

function toggleElevationColor() {
    if (viewMode !== '3D') return;
    useElevationColor3D = !useElevationColor3D;
    const btn = document.getElementById('colorToggleBtn');
    if (useElevationColor3D) {
        btn.innerText = '標高の色分け: ON'; btn.classList.add('active');
    } else {
        btn.innerText = '標高の色分け: OFF'; btn.classList.remove('active');
    }
    sync2DTo3D();
}

function toggleContourLine() {
    const btn = document.getElementById('contourToggleBtn');
    if (viewMode === '3D') {
        showContour3D = !showContour3D;
        if (showContour3D) {
            btn.innerText = '等高線の表示: ON'; btn.classList.add('active');
        } else {
            btn.innerText = '等高線の表示: OFF'; btn.classList.remove('active');
        }
        sync2DTo3D();
    } else {
        showContour2D = !showContour2D;
        if (showContour2D) {
            btn.innerText = '等高線の表示: ON'; btn.classList.add('active');
        } else {
            btn.innerText = '等高線の表示: OFF'; btn.classList.remove('active');
        }
        draw2D();
    }
}

function setMode(mode) {
    if (viewMode === '3D') return; 
    currentMode = mode;
    document.getElementById('raiseBtn').classList.toggle('active', mode === 'raise');
    document.getElementById('roadBtn').classList.toggle('active', mode === 'road');
    document.getElementById('riverBtn').classList.toggle('active', mode === 'river');
    document.getElementById('houseBtn').classList.toggle('active', mode === 'house');
    document.getElementById('eraseBtn').classList.toggle('active', mode === 'erase');

    const brushArea = document.getElementById('brushSizeArea');
    brushArea.style.opacity = (mode === 'house') ? "0.4" : "1.0";
}

function setBrushSize(size) {
    if (currentMode === 'house') return; 
    document.getElementById('sizeMinBtn').classList.remove('active');
    document.getElementById('sizeSmallBtn').classList.remove('active');
    document.getElementById('sizeLargeBtn').classList.remove('active');

    if (size === 'min') { currentBrushRadius = 0.5; document.getElementById('sizeMinBtn').classList.add('active'); }
    else if (size === 'small') { currentBrushRadius = 1.0; document.getElementById('sizeSmallBtn').classList.add('active'); }
    else if (size === 'large') { currentBrushRadius = 2.5; document.getElementById('sizeLargeBtn').classList.add('active'); }
}

function toggleViewMode() {
    const btn = document.getElementById('viewBtn');
    const toggleBtn = document.getElementById('colorToggleBtn');
    const contourBtn = document.getElementById('contourToggleBtn'); 
    const loadLabel = document.getElementById('loadLabel');
    const guide = document.getElementById('guideText');
    
    if (viewMode === '2D') {
        viewMode = '3D';
        btn.innerText = '2Dエディタに戻る';
        toggleBtn.style.display = 'inline-block';
        
        contourBtn.innerText = showContour3D ? '等高線の表示: ON' : '等高線の表示: OFF';
        contourBtn.classList.toggle('active', showContour3D);
        
        canvas2d.style.display = 'none'; canvas3d.style.display = 'block';
        canvas3d.style.zIndex = '2'; canvas2d.style.zIndex = '1';
        guide.innerHTML = '【3D操作】 ドラッグ: 回転 / ホイール: ズーム / 右クリックドラッグ: 並行移動';
        
        ['raiseBtn','roadBtn','riverBtn','houseBtn','eraseBtn','sizeMinBtn','sizeSmallBtn','sizeLargeBtn','undoBtn'].forEach(id => {
            document.getElementById(id).disabled = true;
        });
        loadLabel.classList.add('disabled');

        sync2DTo3D();
        resetCameraPosition(); 
        controls.target.set(GRID_SIZE / 2, 0, GRID_SIZE / 2);
        controls.update();
        animate3D(); 
    } else {
        viewMode = '2D';
        btn.innerText = '3D表示に切り替え';
        toggleBtn.style.display = 'none';
        
        contourBtn.innerText = showContour2D ? '等高線の表示: ON' : '等高線の表示: OFF';
        contourBtn.classList.toggle('active', showContour2D);
        
        canvas2d.style.display = 'block'; canvas3d.style.display = 'none';
        canvas2d.style.zIndex = '2'; canvas3d.style.zIndex = '1';
        guide.innerText = '選択中のモードで画面をドラッグしてください。';
        
        ['raiseBtn','roadBtn','riverBtn','houseBtn','eraseBtn','sizeMinBtn','sizeSmallBtn','sizeLargeBtn','undoBtn'].forEach(id => {
            document.getElementById(id).disabled = false;
        });
        loadLabel.classList.remove('disabled');
        draw2D();
    }
}

function clearAll() {
    if (confirm('すべてリセットしますか？')) {
        saveHistory();
        for (let x = 0; x < GRID_SIZE; x++) {
            heightMap[x].fill(0); roadMap[x].fill(false); riverMap[x].fill(false); houseMap[x].fill(false);
        }
        if (viewMode === '2D') draw2D(); else sync2DTo3D();
    }
}

function drawSmoothContours2D() {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas2d.width, canvas2d.height);

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#111111';

    const contourInterval = 3.0; 
    const maxH = MAX_HEIGHT;

    function interp(v1, v2, target) {
        if (Math.abs(v1 - v2) < 0.00001) return 0.5;
        return (target - v1) / (v2 - v1);
    }

    for (let targetLevel = contourInterval; targetLevel <= maxH; targetLevel += contourInterval) {
        for (let x = 0; x < GRID_SIZE - 1; x++) {
            for (let y = 0; y < GRID_SIZE - 1; y++) {
                const vTL = heightMap[x][y];
                const vTR = heightMap[x + 1][y];
                const vBR = heightMap[x + 1][y + 1];
                const vBL = heightMap[x][y + 1];

                const bTL = vTL >= targetLevel ? 8 : 0;
                const bTR = vTR >= targetLevel ? 4 : 0;
                const bBR = vBR >= targetLevel ? 2 : 0;
                const bBL = vBL >= targetLevel ? 1 : 0;
                const squareIndex = bTL | bTR | bBR | bBL;

                if (squareIndex === 0 || squareIndex === 15) continue;

                const pxTL = x * CELL_SIZE;
                const pyTL = y * CELL_SIZE;

                const topPt = { x: pxTL + interp(vTL, vTR, targetLevel) * CELL_SIZE, y: pyTL };
                const rightPt = { x: pxTL + CELL_SIZE, y: pyTL + interp(vTR, vBR, targetLevel) * CELL_SIZE };
                const bottomPt = { x: pxTL + interp(vBL, vBR, targetLevel) * CELL_SIZE, y: pyTL + CELL_SIZE };
                const leftPt = { x: pxTL, y: pyTL + interp(vTL, vBL, targetLevel) * CELL_SIZE };

                ctx.beginPath();
                switch (squareIndex) {
                    case 1: case 14: ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(bottomPt.x, bottomPt.y); break;
                    case 2: case 13: ctx.moveTo(bottomPt.x, bottomPt.y); ctx.lineTo(rightPt.x, rightPt.y); break;
                    case 3: case 12: ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(rightPt.x, rightPt.y); break;
                    case 4: case 11: ctx.moveTo(topPt.x, topPt.y); ctx.lineTo(rightPt.x, rightPt.y); break;
                    case 5:
                        ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(topPt.x, topPt.y);
                        ctx.moveTo(bottomPt.x, bottomPt.y); ctx.lineTo(rightPt.x, rightPt.y); break;
                    case 6: case 9: ctx.moveTo(topPt.x, topPt.y); ctx.lineTo(bottomPt.x, bottomPt.y); break;
                    case 7: case 8: ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(topPt.x, topPt.y); break;
                    case 10:
                        ctx.moveTo(leftPt.x, leftPt.y); ctx.lineTo(bottomPt.x, bottomPt.y);
                        ctx.moveTo(topPt.x, topPt.y); ctx.lineTo(rightPt.x, rightPt.y); break;
                }
                ctx.stroke();
            }
        }
    }
}

function draw2D() {
    ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);

    if (showContour2D) {
        drawSmoothContours2D();
        return;
    }

    for (let x = 0; x < GRID_SIZE; x++) {
        for (let y = 0; y < GRID_SIZE; y++) {
            const h = heightMap[x][y];
            
            let red = 30, green = 30, blue = 30;
            if (h > 0) {
                green = Math.min(255, Math.floor(30 + h * 6));
                red = Math.min(255, Math.floor(30 + Math.max(0, h - 20) * 12));
                blue = Math.min(255, Math.floor(30 + Math.max(0, h - 35) * 15));
            }
            
            if (roadMap[x][y]) {
                red = Math.floor(red * 0.4 + 100); 
                green = Math.floor(green * 0.4 + 100); 
                blue = Math.floor(blue * 0.4 + 100);
            } 
            else if (riverMap[x][y]) {
                red = Math.floor(red * 0.2 + 20); 
                green = Math.floor(green * 0.4 + 80); 
                blue = Math.floor(blue * 0.3 + 200);
            }

            ctx.fillStyle = `rgb(${red}, ${green}, ${blue})`;
            ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);

            if (houseMap[x][y]) {
                ctx.fillStyle = '#dc3545'; 
                ctx.fillRect(x * CELL_SIZE + 2, y * CELL_SIZE + 2, CELL_SIZE - 4, CELL_SIZE - 4);
                ctx.fillStyle = '#eeeeee'; 
                ctx.fillRect(x * CELL_SIZE + 5, y * CELL_SIZE + 5, 2, 2);
            }
        }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 1;
    for (let x = 0; x <= GRID_SIZE; x++) {
        ctx.beginPath(); ctx.moveTo(x * CELL_SIZE, 0); ctx.lineTo(x * CELL_SIZE, canvas2d.height); ctx.stroke();
    }
    for (let y = 0; y <= GRID_SIZE; y++) {
        ctx.beginPath(); ctx.moveTo(0, y * CELL_SIZE); ctx.lineTo(canvas2d.width, y * CELL_SIZE); ctx.stroke();
    }
}

function editTerrain(pointerX, pointerY) {
    if (viewMode === '3D') return; 

    const rect = canvas2d.getBoundingClientRect();
    const mouseXInGrid = (pointerX - rect.left) / CELL_SIZE;
    const mouseYInGrid = (pointerY - Math.max(0, rect.top)) / CELL_SIZE;

    const clickX = Math.floor(mouseXInGrid);
    const clickY = Math.floor(mouseYInGrid);

    if (clickX < 0 || clickX >= GRID_SIZE || clickY < 0 || clickY >= GRID_SIZE) return;

    if (!hasChangedThisStroke) {
        saveHistory();
        hasChangedThisStroke = true;
    }

    if (currentMode === 'house') {
        if (lastPlacedHouseCell.x === clickX && lastPlacedHouseCell.y === clickY) return;
        if (!riverMap[clickX][clickY]) {
            houseMap[clickX][clickY] = true;
            roadMap[clickX][clickY] = false; 
            lastPlacedHouseCell = { x: clickX, y: clickY };
        }
        draw2D();
        return;
    }

    const searchRange = Math.ceil(currentBrushRadius) + 1;
    for (let x = Math.max(0, clickX - searchRange); x <= Math.min(GRID_SIZE - 1, clickX + searchRange); x++) {
        for (let y = Math.max(0, clickY - searchRange); y <= Math.min(GRID_SIZE - 1, clickY + searchRange); y++) {
            const distance = Math.sqrt((x + 0.5 - mouseXInGrid) ** 2 + (y + 0.5 - mouseYInGrid) ** 2);
            
            if (distance <= currentBrushRadius) {
                if (currentMode === 'road') {
                    roadMap[x][y] = true; riverMap[x][y] = false; houseMap[x][y] = false;
                } else if (currentMode === 'river') {
                    riverMap[x][y] = true; roadMap[x][y] = false; houseMap[x][y] = false;
                } else {
                    const t = distance / currentBrushRadius;
                    const hillFactor = (Math.cos(t * Math.PI) + 1) / 2; 
                    
                    if (currentMode === 'raise') {
                        heightMap[x][y] = Math.min(MAX_HEIGHT, heightMap[x][y] + hillFactor * BRUSH_SPEED);
                    } else if (currentMode === 'erase') {
                        heightMap[x][y] = Math.max(0, heightMap[x][y] - hillFactor * ERASE_SPEED);
                        roadMap[x][y] = false; riverMap[x][y] = false; houseMap[x][y] = false;
                    }
                }
            }
        }
    }
    draw2D();
}

canvas2d.addEventListener('mousedown', (e) => { 
    isDrawing = true; hasChangedThisStroke = false; lastPlacedHouseCell = { x: -1, y: -1 }; editTerrain(e.clientX, e.clientY); 
});
window.addEventListener('mousemove', (e) => { if (isDrawing) editTerrain(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { isDrawing = false; });

canvas2d.addEventListener('touchstart', (e) => {
    isDrawing = true; hasChangedThisStroke = false; lastPlacedHouseCell = { x: -1, y: -1 };
    editTerrain(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault();
}, { passive: false });
canvas2d.addEventListener('touchmove', (e) => {
    if (isDrawing) { editTerrain(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
}, { passive: false });
canvas2d.addEventListener('touchend', () => { isDrawing = false; });

init3D();
draw2D();
</script>
